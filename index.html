<style>
  /* ============================================================
     KULA SOURCE ENGINE v3: TOKEN CONTRACT
     This file is fixed mechanism. Do not edit it per series.
     A skin sets the THIRTEEN identity variables in the block below
     and nothing else is required of it.

     Two accents, split by job:
       --a1  accent one: navigation, progress, emphasis, option letters,
             the primary button, the story date. The "structure" accent.
       --a2  accent two: anything the learner earned. Correct answers,
             the running summary, breakdown bars, key facts, the last
             story line. The "reward" accent.
     Set --a1-rgb / --a2-rgb to the SAME colours as r,g,b (no #), because
     the tints, washes and shadows are built from them.
     ============================================================ */

  :root {
    /* ---- THE IDENTITY CONTRACT. A skin overrides these thirteen. ---- */
    --sand:  #F2E9D9;   /* page background */
    --paper: #FBF6EB;   /* cards */
    --cut:   #FFFCF4;   /* insets, sources, carousels */
    --ink:   #1B2A33;   /* body text */
    --clay:  #8C4A2F;   /* stage tags, quiet labels */
    --fade:  #7B7263;   /* muted text, captions */
    --a1: #B4622D;   --a1-rgb: 180,98,45;
    --a2: #1F6B58;   --a2-rgb: 31,107,88;
    --serif: Georgia, 'Times New Roman', serif;
    --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono:  var(--sans);

    /* ---- DERIVED TOKENS. A skin should not need to touch these. ----
       They exist because the engine used to hardcode fourteen literal
       colours, which is what made every glossary definition and every
       source expander invisible in dark mode. Everything below now
       tracks the identity variables above, so a skin that sets --fade
       and --ink correctly gets a readable dark mode for free. ---- */
    --muted:      var(--fade);          /* secondary body text: kt-def, toggle-body, disc-body, cover-line */
    --hair:       rgba(0,0,0,0.12);     /* progress track, quiet rules */
    --hair-strong:rgba(0,0,0,0.28);     /* dashed divider inside an expander */
    --on-ink:     var(--paper);         /* text sitting on an --ink ground */
    --on-ink-mute:#B8AFE0;              /* secondary text on an --ink ground */
    --on-a1:      var(--paper);         /* text sitting on an --a1 ground */
    --on-a2:      var(--paper);         /* text sitting on an --a2 ground */
    --ink-deep:   #12202a;              /* --ink one step darker, button hover */
    --a2-deep:    #164C3F;              /* --a2 one step darker, button hover */
    --ok-bg:      rgba(var(--a2-rgb),0.13);  /* a correct option, a placed item */
    --no-bg:      rgba(140,74,47,0.13);      /* a wrong option, a misplaced item */
    /* Skill chips. a = the entry-level skill (Extract, Argue, Evidence, Recall).
       b = the middle skill (Interpret, Understand). c = unassessed instinct.
       The top skill (Evaluate, Weigh, Apply) sits on a solid accent ground. */
    --chip-a-bg: rgba(var(--a1-rgb),0.16);  --chip-a-fg: var(--a1);
    --chip-b-bg: rgba(var(--a2-rgb),0.16);  --chip-b-fg: var(--a2);
    --chip-c-bg: rgba(0,0,0,0.06);
    --scrim:  rgba(27,42,51,0.5);       /* modal backdrop */
    --inset:  rgba(255,255,255,0.4);    /* sort column well */

    /* Legacy aliases. Older skins and the quiz shell reference these. */
    --copper: var(--a1);
    --malachite: var(--a2);
  }

  /* ---- DARK MODE TOKEN RE-POINT ---------------------------------------
     The skin supplies body.dark values for the thirteen identity variables.
     Everything derived re-points here, once, for every unit. This is the
     engine-level fix for the three defects logged in MOBILE_FIXES_HANDOVER:
     a skin no longer needs the patch block at all.
     ------------------------------------------------------------------- */
  body.dark {
    --muted:      var(--fade);
    --hair:       rgba(255,255,255,0.14);
    --hair-strong:rgba(255,255,255,0.26);
    --on-ink:     var(--sand);
    --on-a1:      var(--sand);
    --on-a2:      var(--sand);
    --ink-deep:   var(--ink);
    --a2-deep:    var(--a2);
    --ok-bg:      rgba(var(--a2-rgb),0.20);
    --no-bg:      rgba(var(--a1-rgb),0.18);
    --chip-a-bg:  rgba(var(--a1-rgb),0.22);  --chip-a-fg: var(--ink);
    --chip-b-bg:  rgba(var(--a2-rgb),0.22);  --chip-b-fg: var(--ink);
    --chip-c-bg:  rgba(255,255,255,0.10);
    --scrim:  rgba(0,0,0,0.62);
    --inset:  rgba(255,255,255,0.05);
  }
  /* Key term chips keep a visible edge once the ground inverts. */
  body.dark .kt-term { border-color: var(--hair-strong); }
  body.dark .kt-term summary { color: var(--ink); }
  body.dark .kt-label { border-top-color: var(--hair-strong); }
  /* v2 dimmed the options a learner did not pick; at 0.45 they vanish on a dark ground. */
  body.dark .option.dimmed, body.dark .option-btn.dimmed { opacity: 0.72; }

  /* ---- MODE TOGGLE. Fixed bottom right, 44px minimum tap target. ---- */
  .mode-toggle {
    position: fixed; bottom: 0.9rem; right: 0.9rem; z-index: 40;
    display: flex; align-items: center; gap: 0.4rem;
    font-family: var(--sans); font-size: 0.66rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.62rem 0.75rem; min-height: 44px;
    background: var(--paper); color: var(--fade);
    border: 1px solid var(--hair-strong); cursor: pointer;
    box-shadow: 0 2px 12px var(--scrim);
  }
  .mode-toggle:hover { color: var(--ink); border-color: var(--a1); }
  .mode-toggle:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
  .mode-toggle svg { width: 0.9rem; height: 0.9rem; fill: none; stroke: currentColor; stroke-width: 1.6; }
  @media (max-width: 520px) {
    .mode-toggle { min-height: 44px; padding: 0.62rem 0.7rem; font-size: 0.64rem; }
  }
  @media print { .mode-toggle { display: none; } }

  /* ---- STICKY HEADER AT 360px --------------------------------------
     .top-meta is a flex row and flex children default to min-width auto,
     so at 360px the eyebrow and the step counter used to overlap. The
     eyebrow now takes the free space and truncates rather than pushing
     the counter off. Renders correctly at 375px and above either way,
     which is why this was missed. 360 is common on mid-range Android.
     ----------------------------------------------------------------- */
  .top-meta { gap: 0.7rem; flex-wrap: nowrap; }
  .top-meta > * { min-width: 0; }
  .top-meta #lesson-tag, .top-meta .top-label {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top-meta .top-count { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 380px) {
    .top-meta { font-size: 0.62rem; letter-spacing: 0.09em; }
  }

/* ANGOLA IEB: ultra
   Identity is the violet accent. In dark it sits against deep indigo with an
   acid lime as the quiet pair colour, so the screen reads as a product a
   learner already uses rather than as a document.
   Independent Africa is one IEB topic with two strands. The Congo is the essay
   strand and holds Ore Seam, so Angola must not read as a variant of it.
   The metaphor comes from what the sources actually are: this strand is argued
   in rooms where outside powers speak about Angola in front of each other, and
   recorded as tabled papers with a symbol in the corner. */

:root {
  /* grounds and ink: cool lilac paper, near-black indigo type */
  --sand:  #F1F0F8;   /* page background */
  --paper: #FFFFFF;   /* cards */
  --cut:   #EAE8F4;   /* insets, sources, carousels */
  --ink:   #100B22;   /* body text */
  --clay:  #55507A;   /* stage tags, quiet labels: steel, not terracotta */
  --fade:  #403A5C;   /* muted text, captions */
  /* accents: violet carries the identity, deep teal labels beside it */
  --a1: #0E6E85;  --a1-rgb: 14,110,133;
  --a2: #6D28D9;  --a2-rgb: 109,40,217;
  /* type: a transitional serif for the history, mono for anything with a symbol */
  --serif: 'Fraunces', Georgia, serif;
  --sans:  'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono:  'JetBrains Mono', ui-monospace, Consolas, monospace;
}

/* Flat ground. Ore Seam layers two warm radial washes; this one is a cold
   surface with a faint vertical rule, like paper on a table. */
body {
  background-image:
    repeating-linear-gradient(90deg, transparent 0 38px, rgba(16,11,34,0.028) 38px 39px) !important;
}

/* Edges are square and ruled rather than soft. Every card carries a hairline
   and a single accent stripe at the head. */
.card, .source, .stat-wrap, .carousel, .kt {
  border-radius: 0 !important;
  border: 1px solid rgba(154,100,16,0.20) !important;
  box-shadow: none !important;
}
.card { border-top: 3px solid var(--a2) !important; }

/* Labels, dates and any document symbol go to mono. This is the strand's
   signature: provenance is carried by the typography, not explained. */
.stage-tag, .cover-eyebrow, .top-meta, .story-unit, .kt-label,
.expl-label, .results-eyebrow, .pop-label, .chip, .marks, .stat-label {
  font-family: var(--mono) !important;
  letter-spacing: 0.14em !important;
}

/* Sources set as tabled papers: margin rule down the left, symbol line right. */
.source {
  background: var(--cut) !important;
  border-left: 3px solid var(--a1) !important;
  padding-left: 1.35rem !important;
}
.source-attr {
  font-family: var(--mono) !important;
  font-size: 0.68rem !important;
  letter-spacing: 0.06em !important;
  text-transform: uppercase;
  color: var(--a1) !important;
  text-align: right;
  border-bottom: 1px solid rgba(154,100,16,0.18);
  padding-bottom: 0.6rem;
  margin-bottom: 0.9rem;
}

/* Cover flourish. The v2 default is a warm radial arc fan plus three dots.
   Both are Ore Seam signatures, so both go. In their place: a ruled bar with a
   single brick mark at the left, like a document reference stripe. */
.header-block::before, .cover-arc, .cover-fan { display: none !important; }
.rule, .cover-rule, .flourish {
  width: 128px !important;
  height: 2px !important;
  background-image: none !important;
  background: linear-gradient(90deg,
    var(--a1) 0 20%, rgba(154,100,16,0.30) 20% 100%) !important;
}

/* The cover lede is italic serif in v2; here it is upright, so the opening
   screen reads as a tabled statement rather than a caption. */
.cover-line { font-style: normal !important; color: var(--clay) !important; }

/* Chips: square, mono, and keyed to the source spine rather than the essay one. */
.chip { border-radius: 0 !important; font-size: 0.6rem !important; }

/* Begin button: outlined rather than solid, so the cover reads cooler. */
.btn-begin {
  background: transparent !important;
  color: var(--ink) !important;
  border: 2px solid var(--ink) !important;
}
.btn-begin:hover { background: var(--ink) !important; color: var(--paper) !important; }


/* Dark mode. The paper ground goes to deep indigo and the cards to a raised
   indigo, so the violet and the lime are the only bright things on screen. */
body.dark {
  --sand:  #0B0918;
  --paper: #151129;
  --cut:   #1E1938;
  --ink:   #EFECFB;
  --clay:  #A79CD4;
  --fade:  #ACA3CC;
  --a1: #C9FF3D;  --a1-rgb: 201,255,61;
  --a2: #A78BFA;  --a2-rgb: 167,139,250;
}
body.dark { background-image:
  repeating-linear-gradient(90deg, transparent 0 38px, rgba(239,236,251,0.035) 38px 39px) !important; }
body.dark .card, body.dark .source, body.dark .stat-wrap,
body.dark .carousel, body.dark .kt { border-color: rgba(167,139,250,0.30) !important; }
body.dark .btn-begin { border-color: var(--ink) !important; color: var(--ink) !important; }
body.dark .btn-begin:hover { background: var(--ink) !important; color: var(--sand) !important; }
body.dark .mode-toggle { background: var(--paper); border-color: rgba(239,236,251,0.24); }

/* The RECALL chip keeps its light background in dark mode, so it glares.
   Tier chips get dark-mode grounds of their own. */
body.dark .chip { background: rgba(167,139,250,0.20) !important; color: #DDD3FE !important; }
body.dark .chip-a,  body.dark .chip-a   { background: rgba(167,139,250,0.22) !important; color: #D3FF7A !important; }
body.dark .chip-b, body.dark .chip-b { background: rgba(201,255,61,0.16) !important; color: #E8FFB8 !important; }
body.dark .chip-c,   body.dark .chip-d  { background: rgba(239,236,251,0.16) !important; color: #EFECFB !important; }
/* Options need a visible edge against the charcoal card. */
body.dark .option-btn, body.dark .opt-btn { border-color: rgba(239,236,251,0.20) !important; }


/* ---- DARK MODE STATE COLOURS -----------------------------------------------
   The base variables flip, but several states carry hardcoded light values.
   Left alone they produce pale text on pale grounds. */

/* Answer states: dark grounds with a coloured edge, text stays --ink. */
body.dark .option-btn.correct {
  background: rgba(167,139,250,0.20) !important;
  border-color: #A78BFA !important;
  color: var(--ink) !important;
}
body.dark .option-btn.wrong {
  background: rgba(167,139,250,0.16) !important;
  border-color: #C4B5FD !important;
  color: var(--ink) !important;
}
body.dark .option-btn.correct .opt-text,
body.dark .option-btn.wrong   .opt-text { color: var(--ink) !important; }
body.dark .option-btn.correct .opt-letter { color: #C4B5FD !important; }
body.dark .option-btn.wrong   .opt-letter { color: #DAFF8C !important; }
body.dark .opt-mark { color: var(--ink) !important; }
/* v2 dims the options a learner did not pick; at 0.45 on a dark ground they vanish. */
body.dark .option-btn.dimmed { opacity: 0.72 !important; }

/* The full-check button is dark-on-dark once the ground inverts. */
body.dark .primary-btn {
  background: var(--cut) !important;
  border: 1px solid rgba(167,139,250,0.45) !important;
  color: var(--ink) !important;
}
body.dark .primary-btn:hover { background: #241E42 !important; }
body.dark .primary-btn .btn-title { color: var(--ink) !important; }
body.dark .primary-btn .btn-sub,
body.dark .primary-btn .btn-arrow { color: #C0B6EC !important; }

/* Section rows and the small action button. */
body.dark .section-btn { border-color: rgba(239,236,251,0.18) !important; color: var(--ink) !important; }
body.dark .section-btn:hover { background: var(--cut) !important; border-color: var(--a2) !important; }
body.dark .primary-btn-small { background: var(--a2) !important; color: #0B0918 !important; }
body.dark .primary-btn-small:hover:not(:disabled) { background: #B79BFB !important; }
body.dark .secondary-btn { border-color: rgba(239,236,251,0.30) !important; color: var(--ink) !important; }
body.dark .secondary-btn:hover:not(:disabled) { background: var(--cut) !important; }

/* The explanation panel and the quiz footer links. */
body.dark .explanation { background: var(--cut) !important; border-color: rgba(167,139,250,0.30) !important; }
body.dark .expl-text { color: var(--ink) !important; }
body.dark .quiz-foot a, body.dark .quiz-foot { color: var(--clay) !important; }


/* The lesson engine uses .option where the quiz uses .option-btn, so the
   state overrides have to name both or half the product stays broken. */
body.dark .option { background: var(--cut) !important; border-color: rgba(239,236,251,0.18) !important; color: var(--ink) !important; }
body.dark .option.selected { background: rgba(167,139,250,0.14) !important; border-color: #C4B5FD !important; }
body.dark .option.correct {
  background: rgba(167,139,250,0.20) !important;
  border-color: #A78BFA !important;
  color: var(--ink) !important;
}
body.dark .option.wrong {
  background: rgba(167,139,250,0.16) !important;
  border-color: #C4B5FD !important;
  color: var(--ink) !important;
}
body.dark .option.correct .opt-text,
body.dark .option.wrong   .opt-text { color: var(--ink) !important; }
body.dark .option.correct .opt-letter { color: #C4B5FD !important; }
body.dark .option.wrong   .opt-letter { color: #DAFF8C !important; }
body.dark .option.dimmed { opacity: 0.72 !important; }


/* The toggle is fixed bottom right and lands on the Continue button on a short
   viewport. Lift it clear and give the page room underneath. */
.mode-toggle { bottom: 1rem; right: 1rem; }
body { padding-bottom: 4.5rem !important; }
@media (max-width: 520px) {
  .mode-toggle { bottom: 0.7rem; right: 0.7rem; padding: 0.45rem 0.6rem; font-size: 0.6rem; }
}


/* Figures. Captions read left, not centred, and at a measure that holds. */
.figure figcaption {
  text-align: left !important;
  max-width: 34rem;
  margin-left: auto; margin-right: auto;
  font-size: 0.84rem !important;
  color: var(--clay) !important;
  border-top: 1px solid rgba(154,100,16,0.20);
  padding-top: 0.6rem;
}
.figure img { border: 1px solid rgba(154,100,16,0.30) !important; }
body.dark .figure img { border-color: rgba(201,255,61,0.30) !important; }
body.dark .figure figcaption { border-top-color: rgba(201,255,61,0.24); }
/* An archival photograph should not glare against the dark ground. */
body.dark .figure img { filter: brightness(0.9) contrast(1.02); }



* { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(90deg, rgba(var(--a1-rgb),0.05) 0 1px, transparent 1px 5px),
      radial-gradient(ellipse at top right, rgba(var(--a1-rgb),0.10) 0%, transparent 58%),
      radial-gradient(ellipse at bottom left, rgba(var(--a2-rgb),0.09) 0%, transparent 58%),
      var(--sand);
    padding: 1.6rem 1rem 3rem;
    font-family: var(--serif);
    color: var(--ink); line-height: 1.6; -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .top-bar { margin-bottom: 1.6rem; }
  .top-meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.55rem; gap: 0.7rem; flex-wrap: nowrap; }
  /* Flex children default to min-width auto, so at 360px the eyebrow and the
     step counter used to overlap. The eyebrow takes the free space and
     truncates instead of pushing the counter off the row. */
  .top-meta > * { min-width: 0; }
  .top-meta #lesson-tag, .top-meta .top-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-meta .top-count { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 380px) { .top-meta { font-size: 0.62rem; letter-spacing: 0.09em; } }
  .top-count { color: var(--fade); font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .track { height: 3px; background: var(--hair); overflow: hidden; }
  .fill { height: 100%; background: var(--a1); transition: width 0.35s ease; width: 0%; }

  /* Cover */
  .cover { text-align: center; padding: 1.2rem 0 1rem; }
  .cover-eyebrow { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 1.4rem; }
  .cover-title { font-size: clamp(2.3rem,7vw,3.6rem); font-weight: 800; line-height: 1.03; letter-spacing: -0.025em; margin-bottom: 1.3rem; }
  .flourish { width: 92px; height: 9px; margin: 0 auto 1.6rem;
    background:
      radial-gradient(circle at 9px 4.5px, var(--a1) 0 4px, transparent 4.5px),
      radial-gradient(circle at 46px 4.5px, var(--a1) 0 4px, transparent 4.5px),
      radial-gradient(circle at 83px 4.5px, var(--a1) 0 4px, transparent 4.5px); }
  .cover-line { font-size: 1.16rem; line-height: 1.7; color: var(--muted); font-style: italic; max-width: 30rem; margin: 0 auto 2rem; min-height: 5.5rem; }
  .cover-line span { opacity: 0; transition: opacity 0.5s ease; }
  .cover-line span.vis { opacity: 1; }
  .cover-time { font-family: var(--sans); font-size: 0.8rem; color: var(--fade); margin-top: 1.4rem; letter-spacing: 0.02em; }
  .btn-begin { font-family: var(--sans); display: inline-flex; align-items: center; gap: 0.8rem; padding: 1.05rem 2.2rem; background: var(--ink); color: var(--on-ink); border: none; cursor: pointer; font-size: 1.12rem; font-weight: 700; }
  .btn-begin:hover { background: var(--ink-deep); }
  .btn-begin .sa { color: var(--a1); font-size: 1.3rem; }
  .skip-link { display: block; margin: 1.6rem auto 0; background: transparent; border: none; color: var(--fade); font-family: var(--sans); font-size: 0.84rem; cursor: pointer; text-decoration: underline; }

  /* Story hook */
  .story { padding: 0.6rem 0 0.4rem; min-height: 60vh; display: flex; flex-direction: column; justify-content: center; }
  .story-num { font-family: var(--serif); font-size: clamp(2.6rem,9vw,4rem); font-weight: 800; color: var(--a1); line-height: 1; letter-spacing: -0.02em; }
  .story-unit { font-family: var(--sans); font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fade); font-weight: 700; margin-top: 0.5rem; }
  .story-rule { width: 100%; height: 1px; background: var(--hair-strong); margin: 1.4rem 0 1.6rem; }
  .story-line { font-size: 1.24rem; line-height: 1.66; margin-bottom: 1.05rem; opacity: 0; transform: translateY(6px); transition: opacity 0.55s ease, transform 0.55s ease; }
  .story-line.vis { opacity: 1; transform: translateY(0); }
  .story-line.last { color: var(--a2); font-style: italic; font-weight: 600; }

  /* Content cards */
  .card { background: var(--paper); border: 1px solid var(--hair); border-left: 5px solid var(--a1); padding: 1.7rem 1.5rem; margin-bottom: 1.3rem; }
  .stage-tag { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.9rem; }
  .card h2 { font-family: var(--sans); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 0.9rem; }
  .card p { font-size: 1.04rem; line-height: 1.74; margin-bottom: 0.9rem; }
  .card p:last-child { margin-bottom: 0; }
  .key { color: var(--a2); font-weight: 700; }        /* one emphasis colour, body face kept */
  .card strong { color: var(--a2); font-weight: 700; }
  .pull { border-left: 4px solid var(--a2); padding: 0.15rem 0 0.15rem 1rem; font-weight: 600; color: var(--ink); margin: 1.15rem 0; font-style: italic; }
  .figure { margin: 1rem 0 0.3rem; }
  .figure img { display: block; height: auto; border: 1px solid var(--hair-strong); margin: 0 auto; }
  .figure.wide img { width: 100%; max-width: 460px; }
  .figure.portrait img { width: 100%; max-width: 320px; }
  .figure figcaption { font-family: var(--serif); font-size: 0.82rem; color: var(--fade); margin-top: 0.5rem; line-height: 1.55; text-align: center; }

  /* Carousel */
  .car-wrap { margin: 0.4rem 0 0; }
  .car-prompt { font-family: var(--sans); font-size: 0.82rem; color: var(--a2); font-weight: 700; margin-bottom: 0.8rem; }
  .car-frame { background: var(--cut); border: 1px solid var(--hair); border-top: 3px solid var(--a1); padding: 1.4rem 1.35rem; min-height: 8.5rem; display: flex; align-items: center; }
  .car-card { font-size: 1.06rem; line-height: 1.7; width: 100%; }
  .car-card .cc-lead { font-family: var(--sans); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--clay); display: block; margin-bottom: 0.5rem; }
  .car-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 0.9rem; gap: 1rem; }
  .car-dots { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .car-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hair-strong); }
  .car-dot.read { background: var(--a2); }
  .car-dot.here { outline: 2px solid var(--a1); outline-offset: 2px; }
  .car-count { font-family: var(--sans); font-size: 0.78rem; color: var(--fade); font-weight: 600; }
  .car-btns { display: flex; gap: 0.5rem; }
  .car-btn { font-family: var(--sans); width: 2.4rem; height: 2.4rem; background: var(--paper); border: 1px solid var(--hair-strong); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
  .car-btn:disabled { opacity: 0.32; cursor: not-allowed; }

  /* Stat strip */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 0.8rem; margin: 0.5rem 0 0.2rem; }
  .stat { background: var(--cut); border: 1px solid var(--hair); border-top: 3px solid var(--a2); padding: 1.1rem 0.7rem; text-align: center; }
  .stat-num { font-family: var(--serif); font-size: 2rem; font-weight: 800; color: var(--a2); line-height: 1; letter-spacing: -0.02em; }
  .stat-label { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--fade); margin-top: 0.5rem; line-height: 1.4; }

  /* Key terms + memory boxes (collapsed) */
  /* Key terms strip: label + individual expandable chips */
  .kt { margin-top: 1.3rem; }
  .kt-label { font-family: var(--sans); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--a1); padding-top: 0.85rem; border-top: 1px dashed var(--hair-strong); }
  .kt-row { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.85rem; }
  .kt-term { border: 1px solid var(--hair-strong); background: transparent; }
  .kt-term summary { font-family: var(--sans); font-size: 0.92rem; font-weight: 600; color: var(--ink); cursor: pointer; list-style: none; padding: 0.55rem 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem; }
  .kt-term summary::-webkit-details-marker { display: none; }
  .kt-term summary::after { content: "+"; color: var(--a1); font-weight: 800; font-size: 1.05rem; }
  .kt-term[open] { display: block; width: 100%; }
  .kt-term[open] summary::after { content: "\2212"; }
  .kt-def { font-size: 0.94rem; line-height: 1.62; color: var(--muted); padding: 0 0.85rem 0.75rem; }

  /* Remember box (collapsed) */
  .remember { margin-top: 0.9rem; border-top: 1px dashed var(--hair-strong); padding-top: 0.7rem; }
  .remember summary { font-family: var(--sans); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; color: var(--a1); cursor: pointer; list-style: none; }
  .remember summary::-webkit-details-marker { display: none; }
  .remember summary::before { content: "+ "; font-weight: 800; }
  .remember[open] summary::before { content: "\2212 "; }
  .remember .disc-body { font-size: 0.96rem; line-height: 1.68; color: var(--muted); margin-top: 0.6rem; background: rgba(var(--a2-rgb),0.06); border-left: 3px solid var(--a2); padding: 0.7rem 0.9rem; }

  /* Sources */
  .source { position: relative; background: var(--cut); border: 1px solid var(--hair); border-top: 3px solid var(--a2); box-shadow: 6px 6px 0 rgba(var(--a2-rgb),0.13); padding: 1.2rem 1.3rem; margin: 1.15rem 0 1.6rem; }
  .source-attr { font-family: var(--sans); font-size: 0.8rem; color: var(--clay); font-weight: 600; margin-bottom: 0.75rem; line-height: 1.5; }
  .source-body { font-size: 1.02rem; line-height: 1.74; }
  .source-body em { color: var(--a2); font-style: italic; }
  .toggle-btn { font-family: var(--sans); background: transparent; border: none; color: var(--a1); cursor: pointer; font-size: 0.88rem; font-weight: 600; text-decoration: underline; padding: 0.7rem 0 0; }
  .toggle-body { display: none; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed var(--hair-strong); font-size: 0.94rem; color: var(--muted); line-height: 1.66; }
  .toggle-body.open { display: block; }

  /* Questions */
  .q-text { font-size: 1.16rem; line-height: 1.5; font-weight: 600; margin-bottom: 1.2rem; }
  .options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }
  .option { display: flex; align-items: flex-start; gap: 0.85rem; padding: 1rem 1.05rem; background: var(--sand); border: 1px solid var(--hair); cursor: pointer; font-family: var(--serif); text-align: left; font-size: 0.99rem; line-height: 1.55; color: var(--ink); width: 100%; }
  .option:hover:not(:disabled) { background: var(--cut); border-color: var(--a1); }
  .option:disabled { cursor: default; }
  .option.selected { background: var(--cut); border-color: var(--a1); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.correct { background: var(--ok-bg); border-color: var(--a2); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.wrong { background: var(--no-bg); border-color: var(--clay); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.dimmed { opacity: 0.46; }
  body.dark .option.dimmed { opacity: 0.72; }
  .opt-letter { font-family: var(--serif); font-weight: 800; color: var(--a1); min-width: 1.1rem; }
  .opt-text { flex: 1; }
  .opt-mark { font-weight: 700; font-size: 1.1rem; }
  .explanation { background: var(--cut); border: 1px solid var(--hair); border-left: 5px solid var(--a2); padding: 1.15rem 1.2rem; }
  .expl-label { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.5rem; }
  .expl-text { line-height: 1.7; font-size: 0.96rem; }
  .chip { display: inline-block; font-family: var(--sans); padding: 0.22rem 0.65rem; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .chip-a { background: var(--chip-a-bg); color: var(--chip-a-fg); }
  .chip-b { background: var(--chip-a-bg); color: var(--chip-a-fg); }
  .chip-c { background: var(--a2); color: var(--on-a2); }
  .chip-a { background: var(--chip-a-bg); color: var(--chip-a-fg); }
  .chip-b { background: var(--chip-b-bg); color: var(--chip-b-fg); }
  .chip-d { background: var(--a2); color: var(--on-a2); }
  .chip-instinct { background: var(--chip-c-bg); color: var(--clay); }

  /* Reopen the source from inside a question */
  .srcpeek { border: 1px solid var(--clay); background: rgba(var(--a1-rgb),0.07); margin: 0 0 1rem; }
  .srcpeek summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 0.7rem; padding: 0.8rem 0.85rem; color: var(--clay); }
  .srcpeek summary::-webkit-details-marker { display: none; }
  .srcpeek .chev { flex: 0 0 auto; transition: transform 0.18s ease; }
  .srcpeek[open] .chev { transform: rotate(90deg); }
  .srcpeek .peek-cue { font-family: var(--sans); font-size: 0.92rem; font-weight: 700; line-height: 1.25; color: var(--ink); }
  .srcpeek .peek-who { display: block; font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.09em; text-transform: uppercase; font-weight: 400; color: var(--muted); margin-top: 0.25rem; }
  .srcpeek[open] .peek-cue { color: var(--muted); }
  .srcpeek .peek-body { padding: 0 0.85rem 0.85rem; font-size: 0.94rem; line-height: 1.62; border-top: 1px solid var(--rule); margin: 0 0.85rem; padding-left: 0; padding-right: 0; }
  .srcpeek .peek-body p { margin: 0.7rem 0 0; }

  /* v2.1 multi-source reopen. Tabs plus a swipeable track, so every source in
     the file is reachable from any question. Absent on a single-source lesson,
     which renders exactly as it did before. */
  .srcpeek.multi .peek-body { padding-bottom: 0.5rem; }
  .peek-tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding: 0.7rem 0 0.6rem;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .peek-tabs::-webkit-scrollbar { display: none; }
  .peek-tab { flex: 0 0 auto; min-height: 40px; padding: 0.45rem 0.85rem;
    font-family: var(--sans); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--rule); border-radius: 0; }
  .peek-tab.on { background: var(--a1); color: var(--on-a1); border-color: var(--a1); }
  .peek-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 0; }
  .peek-track::-webkit-scrollbar { display: none; }
  .peek-slide { flex: 0 0 100%; scroll-snap-align: start; padding-right: 0.1rem; }
  .peek-slide .peek-attr { font-family: var(--sans); font-size: 0.66rem; font-weight: 700;
    line-height: 1.45; color: var(--muted); padding-bottom: 0.5rem; margin-bottom: 0.6rem;
    border-bottom: 1px solid var(--rule); }
  .peek-slide p { margin: 0.7rem 0 0; }
  .srcpeek.multi::after { content: "Swipe, or tap a source above."; display: block;
    font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.06em; color: var(--muted);
    padding: 0.55rem 0 0.2rem; }
  .srcpeek.multi:not([open])::after { display: none; }

  .marks { font-family: var(--mono, var(--sans)); font-size: 0.68rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--a1); font-weight: 700; margin-left: 0.7rem; }
  .q-meta { margin-bottom: 0.9rem; }

  /* order + sort interactions */
  .inter { margin: 0.4rem 0 1rem; }
  .inter-pool { display: flex; flex-direction: column; gap: 0.5rem; }
  .inter-item { font-family: var(--serif); text-align: left; padding: 0.85rem 1rem; background: var(--sand); border: 1px solid var(--hair); cursor: pointer; font-size: 0.97rem; line-height: 1.5; color: var(--ink); display: flex; gap: 0.7rem; align-items: baseline; }
  .inter-item:hover:not(:disabled) { border-color: var(--a1); background: var(--cut); }
  .inter-item .rank { font-family: var(--sans); font-weight: 800; color: var(--a1); min-width: 1.4rem; }
  .inter-placed { background: var(--cut); border-color: var(--a2); }
  .inter-item.ok { background: var(--ok-bg); border-color: var(--a2); }
  .inter-item.no { background: var(--no-bg); border-color: var(--clay); }
  .sort-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .sort-col { background: var(--inset); border: 1px dashed var(--hair-strong); padding: 0.7rem; min-height: 4rem; }
  .sort-col h4 { font-family: var(--sans); font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.6rem; text-align: center; }
  .sort-btns { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
  .sort-place { font-family: var(--sans); flex: 1; font-size: 0.78rem; font-weight: 700; padding: 0.4rem; background: var(--paper); border: 1px solid var(--hair-strong); cursor: pointer; color: var(--ink); }

  /* Running summary */
  .runsum { background: rgba(var(--a2-rgb),0.08); border: 1px solid rgba(var(--a2-rgb),0.28); border-left: 5px solid var(--a2); padding: 1.3rem 1.4rem; }
  .runsum-label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.9rem; }
  .runsum ol { margin: 0; padding-left: 1.3rem; }
  .runsum li { font-size: 1.02rem; line-height: 1.66; margin-bottom: 0.7rem; color: var(--ink); }
  .runsum li:last-child { margin-bottom: 0; }
  .runsum li.fresh { font-weight: 700; color: var(--a2); }

  /* Popup */
  .pop-back { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 50; }
  .pop { background: var(--paper); border-top: 5px solid var(--a2); padding: 1.6rem 1.5rem; max-width: 30rem; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .pop-label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.8rem; }
  .pop-text { font-size: 1.1rem; line-height: 1.6; font-weight: 600; color: var(--ink); margin-bottom: 1.3rem; }
  .pop-btn { font-family: var(--sans); width: 100%; padding: 0.9rem; background: var(--a2); border: none; color: var(--on-a2); font-size: 0.98rem; font-weight: 700; cursor: pointer; }

  /* Nav */
  .nav { display: flex; justify-content: space-between; gap: 0.8rem; margin-top: 1rem; }
  .btn-secondary { font-family: var(--sans); padding: 0.8rem 1.2rem; background: transparent; border: 1px solid var(--hair-strong); color: var(--ink); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .btn-secondary:hover:not(:disabled) { background: var(--paper); }
  .btn-primary { font-family: var(--sans); padding: 0.85rem 1.5rem; background: var(--a2); border: none; color: var(--on-a2); font-size: 0.95rem; cursor: pointer; font-weight: 700; }
  .btn-primary:hover:not(:disabled) { background: var(--a2-deep); }
  .btn-primary:disabled { opacity: 0.34; cursor: not-allowed; }

  /* Results */
  .results-head { text-align: center; margin-bottom: 1.8rem; }
  .results-eyebrow { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.8rem; }
  .results-title { font-family: var(--sans); font-size: clamp(1.9rem,5.5vw,2.7rem); font-weight: 800; letter-spacing: -0.02em; }
  .score-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 0.9rem; margin-bottom: 1.4rem; }
  .score-block { background: var(--paper); border: 1px solid var(--hair); border-top: 4px solid var(--a1); padding: 1.3rem 0.8rem; text-align: center; }
  .score-num { font-family: var(--serif); font-size: 2.6rem; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: -0.03em; }
  .score-den { font-family: var(--serif); font-size: 1.1rem; color: var(--fade); font-weight: 500; }
  .score-word { font-family: var(--serif); font-size: 1.3rem; font-weight: 800; color: var(--a2); line-height: 2; }
  .score-label { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fade); margin-top: 0.5rem; font-weight: 700; }
  .grade-desc { text-align: center; margin-bottom: 1.6rem; padding: 0 0.5rem; line-height: 1.66; }
  .breakdown { background: var(--paper); border: 1px solid var(--hair); padding: 1.3rem; margin-bottom: 1.4rem; }
  .breakdown-label { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 1rem; text-align: center; }
  .bd-row { display: grid; grid-template-columns: 1fr 110px 46px; gap: 0.7rem; align-items: center; margin-bottom: 0.7rem; font-family: var(--serif); font-size: 0.9rem; }
  .bd-name { font-weight: 600; }
  .bd-bar { height: 9px; background: var(--hair); overflow: hidden; }
  .bd-fill { height: 100%; background: var(--a2); }
  .bd-score { color: var(--fade); text-align: right; font-weight: 700; }
  .results-actions { display: flex; gap: 0.8rem; margin-top: 1.6rem; }
  .results-actions button { flex: 1; }
  .hidden { display: none !important; }


/* ============================================================
   MOBILE. Added August 2026.
   Everything here is inside a narrow-screen query except the tap
   target floor, which applies at every width because a 44px
   target is not worse on a desktop. Nothing above 560px changes.
   ============================================================ */

/* Tap targets. Anything a learner presses is at least 44px tall,
   which is the smallest reliable target for a thumb. */
.btn-primary, .btn-secondary, .btn-small, .btn-skip, .btn-begin,
.term-btn, .toggle-btn, .option, .ord-chip, .ord-slot, .sort-tag,
.mode-toggle, #kula-mode-toggle, button.go, .opt, .chip[role="button"],
.tglr, .termsbtn, .kt-term {
  min-height: 44px;
}

@media (max-width: 560px) {
  /* the page gutter takes width the text needs more than the margin does */
  body { padding-left: 0.75rem; padding-right: 0.75rem; }

  /* two sort columns at 360px leave about 135px each, which is
     narrower than the sentences that go in them */
  .sort-cols, .bins { grid-template-columns: 1fr; }

  /* the results breakdown keeps its three columns and gives the
     label more of them */
  .bd-row      { grid-template-columns: 1fr 72px 38px; gap: 0.5rem; font-size: 0.8rem; }
  .breakdown-row { grid-template-columns: 1fr 68px 36px; gap: 0.5rem; font-size: 0.8rem; }
  .marked      { grid-template-columns: 1fr; }

  /* two buttons plus a gap can exceed the line, so let them wrap
     and fill instead of overflowing */
  .nav, .cap-actions, .actions { flex-wrap: wrap; }
  .nav > *, .cap-actions > *, .actions > * { flex: 1 1 auto; }

  /* display type set for a laptop is too large for a phone */
  .cover-title { font-size: 2rem; line-height: 1.12; }
  .story-num   { font-size: 2.6rem; }
  h1 { font-size: 1.75rem; line-height: 1.18; }
  h2 { font-size: 1.3rem; line-height: 1.25; }

  /* card padding on top of body padding leaves too little for text */
  .card, .sheet, .sleeve, .source { padding-left: 1rem; padding-right: 1rem; }

  /* long attributions and quoted lines must not push the page sideways */
  .attr, .source-attr, .src-attr, blockquote, pre { overflow-wrap: anywhere; }
}

@media (max-width: 400px) {
  .bd-row      { grid-template-columns: 1fr 56px 34px; font-size: 0.76rem; }
  .breakdown-row { grid-template-columns: 1fr 54px 32px; font-size: 0.76rem; }
  .cover-title { font-size: 1.7rem; }
  .story-num   { font-size: 2.2rem; }
}

/* Correct and wrong are coded green and red, below the identity accent.
   Before this, dark mode marked correct in violet and wrong in lime, so the
   two states read as the same colour family. Ticks and crosses already exist
   in the markup, so the coding does not rest on colour alone. */
:root{ --ok:#0F6B3F; --ok-tint:#E6F3EA; --no:#C1121F; --no-tint:#FBE3E4; }
body.dark{ --ok:#6EDA9B; --ok-tint:#12301F; --no:#FF6B5E; --no-tint:#3A1512; }
.option.correct, .option-btn.correct,
body.dark .option.correct, body.dark .option-btn.correct{
  background:var(--ok-tint) !important; border-color:var(--ok) !important; border-width:2px !important; }
.option.wrong, .option-btn.wrong,
body.dark .option.wrong, body.dark .option-btn.wrong{
  background:var(--no-tint) !important; border-color:var(--no) !important; border-width:2px !important; }
.option.correct .opt-letter, .option.correct .opt-mark,
.option-btn.correct .opt-letter, .option-btn.correct .opt-mark,
body.dark .option.correct .opt-letter, body.dark .option.correct .opt-mark,
body.dark .option-btn.correct .opt-letter, body.dark .option-btn.correct .opt-mark{
  color:var(--ok) !important; font-weight:800 !important; }
.option.wrong .opt-letter, .option.wrong .opt-mark,
.option-btn.wrong .opt-letter, .option-btn.wrong .opt-mark,
body.dark .option.wrong .opt-letter, body.dark .option.wrong .opt-mark,
body.dark .option-btn.wrong .opt-letter, body.dark .option-btn.wrong .opt-mark{
  color:var(--no) !important; font-weight:800 !important; }
.option.correct .opt-text, .option.wrong .opt-text,
body.dark .option.correct .opt-text, body.dark .option.wrong .opt-text{ color:var(--ink) !important; }
.explanation.ok, body.dark .explanation.ok{
  background:var(--ok-tint) !important; border-color:var(--ok) !important; border-left-color:var(--ok) !important; }
.explanation.no, body.dark .explanation.no{
  background:var(--no-tint) !important; border-color:var(--no) !important; border-left-color:var(--no) !important; }
.explanation.ok .expl-label, body.dark .explanation.ok .expl-label{ color:var(--ok) !important; }
.explanation.no .expl-label, body.dark .explanation.no .expl-label{ color:var(--no) !important; }

/* The Begin button was re-styled as an outline: background transparent with
   !important, but the colour declaration that made it white sits in a later
   rule, so white text ended up on the pale ground at 1.13. The outlined form
   is the intended one, so the text follows the border. */
.btn-begin{ background:transparent !important; color:var(--ink) !important;

  {
    "type": "content",
    "tag": "The evidence",
    "html": "<h2>How a long war paid for itself</h2><p>Wars need money. The MPLA government leaned on Angola's oil, most of it offshore at Cabinda, and the revenue went on defence rather than on rebuilding.</p><p>UNITA had no state to tax, so Savimbi sold what the land held: diamonds, and ivory from elephants killed for the purpose. Both sides could keep fighting because both sides had something to sell.</p><p>That is why the fighting outlasted the Cold War that started it. When the outside powers went home in 1988 and 1989, the money did not.",
    "remember": "Oil funded one side, diamonds and ivory the other. That's why the war outlived the Cold War.",
    "terms": [
      {
        "term": "Conflict resource",
        "def": "Something a side sells to pay for its own war: oil, diamonds, ivory. It lets a war continue after outside backers withdraw."
      }
    ]
  },
  {
    "type": "content",
    "tag": "The evidence",
    "html": "<h2>Cuito Cuanavale, 1987 to 1988</h2><p>In the south-east, South African and UNITA forces fought Angolan and Cuban forces around the town of Cuito Cuanavale across 1987 and into 1988. Neither side took it.</p><p>What followed was a settlement: Cuban troops out of Angola, South Africa out of Namibia, and Namibian independence in 1990.</p><figure class=\"figure wide\"><img alt=\"The town hall at Cuito Cuanavale, a low white colonial building with two arches, its facade pitted with damage, two flags flying from the roof and red earth in front of it.\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGoAoADASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAQIAAwQFBgcI/8QAPxAAAgIBAwMDAgUDAgUBCAMBAQIAAxEEEiEFMUETUWEGIgcUMnGBI0KRFVIzYnKhsRYIJDRDgpLB0RdTY4P/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAoEQEBAAIBBAMBAQEBAAIDAAAAAQIREgMTITEUQVEEYSJxBSMyQoH/2gAMAwEAAhEDEQA/APtDjPaIFIjgywD3xiZ5McVYJ7Rxz4g4zDuwY3tZNJgZjARcnvxGHPmRTCPmVgxs5OID7jBuJgBzCDg9oBBh3cxQQR2MYEQQwhHeDPEIho4MYNiV55EsBA8QGBIjq3MrB+I24exmRaCI0rUj2McNntDUphLFz4lfaOrYkWUwPOCIxT2MUP8AEhbMlgYHEGcmAnMGcGNByYfMSNnnMBw0dTzKQ0ZWhY0YEBMqDmNnMgsBAjAAmIjD2jZ5gQjEXIzHOCIm3mAwPEmcxcYk8wDtjBcQDmB2IgTEBEG6HPxAXOI6EZzmLgSDGe0C089oMmFCIzfElgqZC3aVEMh5mlTnmLYof3iJpSFIXvEOZftwuYmBjsZrZog7SYjKB7R+O0bLFRXIxF2Yl5wJMCNppRs8ybcHMuYccStgcdpZU0UqIhHtLApk248Rs0XbxBjGY548RGyZZTRI0IXPiWLXmNkh6wMR9oij2xDnmZtbhdoEOQeD4hB45EVsZkiIQCZM8xf08Qc5m0MWhzEMnfzDJiAeYpIEBPzEJiIJOICYMwZ9pqA7jDnzFHEBPxCCTARJFzAOPMi8mAHPgxh3gedwfaDeexk9XiVltxjTO1sg4iZwJA0LtbnMHYxN3MPHvBs2eOIwY4xK92D3jBuYNrQeJAe8QHAgWwsxGMfMC5TxCIgOBGBhThoymKADGGBxDWzjjvGHMQYzyY+B4OI2DCO8AEYDPmZ0pgeIytAE47whB7wg7oVcyBB7xtkNICY2TFwR2MZfnmFSHMEmM9pAwMO0ZzkxRGAjQbA94wHETAh594Dg4j5zKo38SLtcuISPaU8jzG3HHeTRsQxBlgYZlUgzmDa/IkwJVnMIg2cQnBigyMYEIAkxIDmEwFkBEfaCO0X08GBA0ctkRCMQZjQcR4ocAdpA+ZNKOBjETaBGED     "tag": "Two verdicts",
    "html": "<h2>One battle, judged twice</h2><p><strong>Magnus Malan</strong>, South Africa's Minister of Defence, measured the campaign by ground held and losses inflicted. By that measure the South African Defence Force wasn't beaten in the field, and Cuito Cuanavale itself never fell.</p><p><strong>Nelson Mandela</strong> measured it by what it did to the apartheid state. The hold on Namibia was given up, and the fighting told people at home that the state could be beaten.</p><p>Neither is inventing anything. They're counting different things, which is why both accounts survive.</p>",

const CHIP = {
  Stand:{cls:"chip-a"}, Evidence:{cls:"chip-b"}, Focus:{cls:"chip-c"}, Counter:{cls:"chip-d"},
  Comprehend:{cls:"chip-a"}, Apply:{cls:"chip-b"}, Analyse:{cls:"chip-c"}, Evaluate:{cls:"chip-d"},
  Recall:{cls:"chip-a"}, Understand:{cls:"chip-b"},
  instinct:{cls:"chip-instinct"}
};
// A lesson carries one spine or the other. Work it out on first use rather than at
// load time, so this never depends on FLOW having been evaluated yet.
const SOURCE_SPINE = ["Comprehend","Apply","Analyse","Evaluate"];
const ESSAY_SPINE  = ["Stand","Evidence","Focus","Counter"];
let _spine = null;
function spine(){
  if(_spine) return _spine;
  const flow = (typeof FLOW !== "undefined" && Array.isArray(FLOW)) ? FLOW : [];
  _spine = flow.some(s => s && SOURCE_SPINE.includes(s.level)) ? SOURCE_SPINE : ESSAY_SPINE;
  return _spine;
}
// Never let an unknown label throw: an unrecognised spine word degrades to the neutral chip.
const chipCls = lvl => (CHIP[lvl] || CHIP.instinct).cls;

const stage = document.getElementById("stage");
const nav = document.getElementById("nav");
const topBar = document.getElementById("top-bar");
const nextBtn = document.getElementById("next-btn");
const backBtn = document.getElementById("back-btn");

const state = {
  idx: -1,                 // -1 = cover
  answers: {},             // qIdx -> chosen content index (mcq) or serialized (interactive)
  revealed: {},            // qIdx -> bool
  order: {},               // qIdx -> shuffled content-index array
  carRead: {},             // stepIdx -> Set of read card indices
  interState: {},          // qIdx -> working state for order/sort
  poppedBuild: {},         // qIdx -> bool (running-summary popup already shown)
};

const buildIds = FLOW.map((f,i)=>f.build?i:null).filter(i=>i!==null);
const assessedIds = FLOW.map((f,i)=>(f.type==="question"&&f.level)?i:null).filter(i=>i!==null);

function esc(s){
  return String(s).replace(/[&<>"]/g, (c, i, str) => {
    if(c === "&"){
      // leave a real HTML entity intact (e.g. &middot; &amp; &#8635;)
      const rest = str.slice(i);
      if(/^&(#\d+|#x[0-9a-fA-F]+|[a-zA-Z]+);/.test(rest)) return "&";
    }
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

// {optN} -> the letter option N carries after shuffle
function resolveOpts(text, order){
  if(!text) return text;
  return text.replace(/\{opt(\d+)\}/g,(m,n)=>{
    const p = order ? order.indexOf(parseInt(n,10)) : -1;
    return p>=0 ? String.fromCharCode(65+p) : m;
  });
}

// Key-terms strip: label + one expandable chip per term.
function ktStrip(terms){
  if(!terms || !terms.length) return "";
  const chips = terms.map(t=>`<details class="kt-term"><summary>${esc(t.term)}</summary><div class="kt-def">${esc(t.def)}</div></details>`).join("");
  return `<div class="kt"><div class="kt-label">Key terms &middot; tap to open</div><div class="kt-row">${chips}</div></div>`;
}
function rememberBox(text){
  if(!text) return "";
  return `<details class="remember"><summary>Remember it like this</summary><div class="disc-body">${text}</div></details>`;
}

function renderContent(item){
  stage.innerHTML = `<div class="card">${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}${item.html}${rememberBox(item.remember)}${ktStrip(item.terms)}</div>`;

}

// ============ CAROUSEL ============
function renderCarousel(item){
  const cards = item.cards;
  if(!state.carRead[state.idx]) state.carRead[state.idx] = new Set([0]);
  const read = state.carRead[state.idx];
  const pos = state.interState[state.idx]?.pos || 0;
  read.add(pos);
  const c = cards[pos];
  const body = typeof c==="string" ? c : `<span class="cc-lead">${esc(c.lead)}</span>${esc(c.body)}`;
  const dots = cards.map((_,i)=>`<span class="car-dot ${read.has(i)?"read":""} ${i===pos?"here":""}"></span>`).join("");
  const allRead = read.size===cards.length;
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      <div class="car-wrap">
        <div class="car-prompt" id="car-prompt">${allRead?`That is all ${cards.length}. Continue is unlocked.`:`Tap the arrows to read all ${cards.length}. Continue unlocks when you have.`}</div>
        <div class="car-frame"><div class="car-card">${body}</div></div>
        <div class="car-nav">
          <div class="car-dots">${dots}</div>
          <div class="car-count">${pos+1} / ${cards.length}</div>
          <div class="car-btns">
            <button class="car-btn" id="car-prev" ${pos===0?"disabled":""}>&larr;</button>
            <button class="car-btn" id="car-next" ${pos===cards.length-1?"disabled":""}>&rarr;</button>
          </div>
        </div>
      </div>
      ${ktStrip(item.terms)}
    </div>`;
  nextBtn.disabled = !allRead;
  const setPos=(p)=>{ state.interState[state.idx]={pos:p}; renderCarousel(item); };
  const pv=document.getElementById("car-prev"), nx=document.getElementById("car-next");
  if(pv) pv.addEventListener("click",()=>setPos(Math.max(0,pos-1)));
  if(nx) nx.addEventListener("click",()=>setPos(Math.min(cards.length-1,pos+1)));
}

// ============ STAT STRIP ============
function renderStat(item){

// Reopen strip: shown on a question that follows a source, so the learner
// never has to tap Back to reread the extract.
//
// v2.1. Was: the strip offered LAST_SOURCE only. That is correct for a lesson
// built on one source and wrong for a capstone, where the paragraph question
// asks for all of them and a learner on the closing screens could reach only
// the most recent. Now every source seen so far in the file is reachable: a row
// of tabs, and a swipeable track underneath. One source renders exactly as
// before, so nothing in the existing corpus changes.
function sourcePeek(item){
  if(item.noSource) return "";
  if(item.sourceRef && item.sourceRef.body){
    return peekShell([item.sourceRef]);
  }
  const seen = SOURCES_SEEN.filter(s => s && s.body);
  if(!seen.length) return "";
  return peekShell(seen);
}

function peekShell(list){
  const many = list.length > 1;
  const cue = many
    ? `Tap to read the ${list.length} sources again`
    : `Tap to read ${esc(list[0].label)} again`;
  const who = many
    ? list.map(s=>esc(s.label)).join(" &middot; ")
    : esc(stripTags(list[0].attr)).slice(0,90);
  const tabs = many
    ? `<div class="peek-tabs" role="tablist">${list.map((s,i)=>
        `<button class="peek-tab${i===list.length-1?" on":""}" data-peek="${i}" role="tab">${esc(s.label)}</button>`).join("")}</div>`
    : "";
  const track = `<div class="peek-track" data-peek-track>${list.map(s=>
      `<div class="peek-slide"><div class="peek-attr">${s.attr}</div>${s.body}</div>`).join("")}</div>`;
  return `<details class="srcpeek${many?" multi":""}"><summary>
      <svg class="chev" width="11" height="13" viewBox="0 0 11 13" fill="none" aria-hidden="true"><path d="M2 1.5 L8.5 6.5 L2 11.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="peek-cue">${cue}<span class="peek-who">${who}</span></span>
    </summary><div class="peek-body">${tabs}${track}</div></details>`;
}

// Tabs scroll the track; swiping the track updates the tabs. Both work alone,
// so a learner who never notices the tabs can still swipe, and the other way round.
function bindPeek(){
  stage.querySelectorAll(".srcpeek.multi").forEach(d=>{
    const track = d.querySelector("[data-peek-track]");
    const tabs  = Array.from(d.querySelectorAll(".peek-tab"));
    if(!track || !tabs.length) return;
    const go = i => track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
    tabs.forEach(t => t.addEventListener("click", () => go(parseInt(t.dataset.peek,10))));
    let tick = null;
    track.addEventListener("scroll", () => {
      clearTimeout(tick);
      tick = setTimeout(() => {
        const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
        tabs.forEach((t,n) => t.classList.toggle("on", n === i));
      }, 60);
    });
    // open on the source the learner saw last, which is the one they were reading
    d.addEventListener("toggle", () => {
      if(d.open) requestAnimationFrame(() => { track.scrollLeft = (tabs.length-1) * track.clientWidth; });
    });
  });
}
function stripTags(h){ return String(h||"").replace(/<[^>]+>/g,""); }

// ============ SOURCE ============
// Every source rendered so far, in order, so any later question can reopen all
// of them. LAST_SOURCE is kept as the final entry for anything still reading it.
let SOURCES_SEEN = [];
let LAST_SOURCE = null;

function renderSource(item){
  const s=item.source;
  LAST_SOURCE = { label: item.sourceLabel || item.tag || "the source", attr: s.attr, body: s.body };
  if(!SOURCES_SEEN.some(x => x.label === LAST_SOURCE.label)) SOURCES_SEEN.push(LAST_SOURCE);
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      ${item.html||""}
      <div class="source">
        <div class="source-attr">${s.attr}</div>
        <div class="source-body">${s.body}</div>
        ${s.toggle?`<button class="toggle-btn" data-toggle>${s.toggleLabel||"What does this actually mean?"}</button><div class="toggle-body">${s.toggle}</div>`:""}
      </div>
      ${ktStrip(item.terms)}
    </div>`;
  bindToggles();
}

// ============ QUESTION (mcq / order / sort) ============
function renderQuestion(item){
  if(item.mode==="order") return renderOrder(item);
  if(item.mode==="sort") return renderSort(item);
  return renderMCQ(item);
}

function renderMCQ(item){
  const answered = state.revealed[state.idx];
  if(!state.order[state.idx]){
    const a=item.options.map((_,i)=>i);
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    state.order[state.idx]=a;
  }
  const order=state.order[state.idx];
  const chip = item.level ? `<span class="chip ${chipCls(item.level)}">${item.level}</span>` : `<span class="chip chip-instinct">Instinct</span>`;
  let opts="";
  order.forEach((orig,pos)=>{
    let cls="option", mark="";
    if(answered){
      if(orig===item.correct){ cls+=" correct"; mark=`<span class="opt-mark">&#10003;</span>`; }
      else if(orig===state.answers[state.idx]){ cls+=" wrong"; mark=`<span class="opt-mark">&#10007;</span>`; }
      else cls+=" dimmed";
    } else if(state.answers[state.idx]===orig){ cls+=" selected"; }
    opts+=`<button class="${cls}" data-orig="${orig}" ${answered?"disabled":""}><span class="opt-letter">${String.fromCharCode(65+pos)}</span><span class="opt-text">${item.options[orig]}</span>${mark}</button>`;
  });
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta">${chip}${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="options">${opts}</div>
      ${answered?`<div class="explanation ${state.answers[state.idx]===item.correct?"ok":"no"}"><div class="expl-label">${state.answers[state.idx]===item.correct?"Correct":"Not this one"}</div><div class="expl-text">${resolveOpts(item.explanation, order)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{
      state.answers[state.idx]=parseInt(b.dataset.orig,10);
      state.revealed[state.idx]=true;
      render();
    }));
  }
  syncNav(true);
}

// order: tap to place into a numbered list, tap placed to remove; Check when all placed
function renderOrder(item){
  const answered = state.revealed[state.idx];
  const st = state.interState[state.idx] || (state.interState[state.idx]={placed:[]});
  const placed = st.placed;                       // array of content indices in chosen order
  const remaining = item.items.map((_,i)=>i).filter(i=>!placed.includes(i));
  let placedHtml = placed.map((ci,pos)=>{
    let cls="inter-item inter-placed";
    if(answered){ cls = "inter-item "+(ci===item.answer[pos]?"ok":"no"); }
    return `<button class="${cls}" data-placed="${ci}" ${answered?"disabled":""}><span class="rank">${pos+1}</span><span>${esc(item.items[ci])}</span></button>`;
  }).join("");
  let poolHtml = remaining.map(ci=>`<button class="inter-item" data-pool="${ci}"><span class="rank">&bull;</span><span>${esc(item.items[ci])}</span></button>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip ${item.level?chipCls(item.level):"chip-instinct"}">${item.level||"Instinct"}</span>${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="inter-pool" id="placed">${placedHtml||`<div style="color:var(--fade);font-size:0.9rem;padding:0.4rem 0;">Tap an event below to start putting them in order.</div>`}</div>
        ${remaining.length?`<div style="height:1px;background:rgba(27,42,51,0.14);margin:0.9rem 0;"></div><div class="inter-pool" id="pool">${poolHtml}</div>`:""}
      </div>
      ${answered?`<div class="explanation ${state.answers[state.idx]===item.correct?"ok":"no"}"><div class="expl-label">${state.answers[state.idx]===item.correct?"Correct":"Not this one"}</div><div class="expl-text">${resolveOpts(item.explanation,null)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-pool]").forEach(b=>b.addEventListener("click",()=>{ placed.push(parseInt(b.dataset.pool,10)); renderOrder(item); }));
    stage.querySelectorAll("[data-placed]").forEach(b=>b.addEventListener("click",()=>{ const ci=parseInt(b.dataset.placed,10); st.placed=placed.filter(x=>x!==ci); renderOrder(item); }));
  }
  const allPlaced = placed.length===item.items.length;
  syncNavInteractive(allPlaced, answered, ()=>{
    state.answers[state.idx]=placed.slice();
    state.revealed[state.idx]=true; render();
  });
}

// sort: two columns, tap an item's column button to place, tap placed to remove
function renderSort(item){
  const answered = state.revealed[state.idx];
  const st = state.interState[state.idx] || (state.interState[state.idx]={col:{}});
  const col = st.col;                              // content index -> 0/1
  const unplaced = item.items.map((_,i)=>i).filter(i=>!(i in col));
  const colCards = (which)=>item.items.map((it,ci)=>{
    if(col[ci]!==which) return "";
    let cls="inter-item inter-placed";
    if(answered) cls="inter-item "+(item.answer[ci]===which?"ok":"no");
    return `<button class="${cls}" data-un="${ci}" ${answered?"disabled":""}><span>${esc(it)}</span></button>`;
  }).join("");
  const pool = unplaced.map(ci=>`
    <div class="inter-item" style="flex-direction:column;align-items:stretch;cursor:default;">
      <span>${esc(item.items[ci])}</span>
      <div class="sort-btns">
        <button class="sort-place" data-place="${ci}" data-col="0">${esc(item.cols[0])}</button>
        <button class="sort-place" data-place="${ci}" data-col="1">${esc(item.cols[1])}</button>
      </div>
    </div>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip ${item.level?chipCls(item.level):"chip-instinct"}">${item.level||"Instinct"}</span>${item.marks?`<span class="marks">${esc(item.marks)}</span>`:""}</div>
      ${sourcePeek(item)}
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="sort-cols">
          <div class="sort-col"><h4>${esc(item.cols[0])}</h4>${colCards(0)}</div>
          <div class="sort-col"><h4>${esc(item.cols[1])}</h4>${colCards(1)}</div>
        </div>
        ${unplaced.length?`<div style="height:1px;background:rgba(27,42,51,0.14);margin:0.9rem 0;"></div><div class="inter-pool">${pool}</div>`:""}
      </div>
      ${answered?`<div class="explanation ${state.answers[state.idx]===item.correct?"ok":"no"}"><div class="expl-label">${state.answers[state.idx]===item.correct?"Correct":"Not this one"}</div><div class="expl-text">${resolveOpts(item.explanation,null)}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-place]").forEach(b=>b.addEventListener("click",()=>{ col[parseInt(b.dataset.place,10)]=parseInt(b.dataset.col,10); renderSort(item); }));
    stage.querySelectorAll("[data-un]").forEach(b=>b.addEventListener("click",()=>{ delete col[parseInt(b.dataset.un,10)]; renderSort(item); }));
  }
  const allPlaced = unplaced.length===0;
  syncNavInteractive(allPlaced, answered, ()=>{
    state.answers[state.idx]=Object.assign({},col);
    state.revealed[state.idx]=true; render();
  });
}

// ============ RUNNING SUMMARY (own screen) ============
function renderRunsum(item){
  const parts = buildIds.filter(i=>i<=state.idx && state.revealed[i]).map(i=>FLOW[i].part);
  const freshIdx = parts.length-1;
  const lis = parts.map((p,i)=>`<li class="${i===freshIdx?"fresh":""}">${esc(p)}</li>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="stage-tag">${esc(item.tag||"Your running summary")}</div>
      ${item.heading?`<h2>${esc(item.heading)}</h2>`:""}
      ${item.html?item.html:""}
      <div class="runsum"><div class="runsum-label">${esc(item.label||"Your running summary")}</div><ol>${lis}</ol></div>
      ${item.outro?`<p class="runsum-outro">${item.outro}</p>`:""}
    </div>`;
}

// ============ POPUP after a build question ============
function showBuildPop(part, label){
  const back=document.createElement("div");
  back.className="pop-back";
  back.innerHTML=`<div class="pop"><div class="pop-label">${esc(label||"The line you are arguing")}</div><div class="pop-text">${esc(part)}</div><button class="pop-btn" id="pop-ok">Got it</button></div>`;
  document.body.appendChild(back);
  document.getElementById("pop-ok").addEventListener("click",()=>back.remove());
}

// ============ NAV ============
function syncNav(isQuestion){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  nextBtn.style.display="";
  nextBtn.disabled = isQuestion ? !state.revealed[state.idx] : false;
  nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
}
// interactive items: replace Continue with a Check button until answered
function syncNavInteractive(canCheck, answered, onCheck){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  if(answered){
    nextBtn.style.display="";
    nextBtn.disabled=false;
    nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
    nextBtn.onclick = defaultNext;
  } else {
    nextBtn.style.display="";
    nextBtn.disabled=!canCheck;
    nextBtn.innerHTML="Check &rarr;";
    nextBtn.onclick = ()=>{ onCheck(); };
  }
}

function defaultNext(){
  // fire the running-summary popup when leaving a build question
  const cur=FLOW[state.idx];
  if(cur && cur.build && state.revealed[state.idx] && !state.poppedBuild[state.idx]){
    state.poppedBuild[state.idx]=true;
    showBuildPop(cur.part, cur.buildLabel);
  }
  if(state.idx<FLOW.length-1){ state.idx++; render(); } else showResults();
}

nextBtn.onclick = defaultNext;
backBtn.addEventListener("click",()=>{
  if(state.idx<=0){ state.idx=-1; renderCover(); }
  else { state.idx--; render(); }
});

// ============ RENDER DISPATCH ============
function render(){
  window.scrollTo({top:0,behavior:"instant"});
  if(state.idx===-1){ renderCover(); return; }
  topBar.classList.remove("hidden");
  document.getElementById("step-count").textContent=`Step ${state.idx+1} of ${FLOW.length}`;
  document.getElementById("fill").style.width=((state.idx+1)/FLOW.length*100)+"%";
  const item=FLOW[state.idx];
  nextBtn.onclick = defaultNext;
  switch(item.type){
    case "story": renderStory(item); syncNav(false); break;
    case "carousel": renderCarousel(item); /* nav handled inside */ syncNavCarousel(); break;
    case "stat": renderStat(item); syncNav(false); break;
    case "source": renderSource(item); syncNav(false); break;
    case "question": renderQuestion(item); break;
    case "runsum": renderRunsum(item); syncNav(false); break;
    default: renderContent(item); syncNav(false);
  }
}
function syncNavCarousel(){
  nav.classList.remove("hidden");
  backBtn.disabled=false;
  backBtn.innerHTML = state.idx===0 ? "&larr; Back to the start" : "&larr; Back";
  nextBtn.style.display="";
  nextBtn.innerHTML = state.idx===FLOW.length-1 ? "See results &rarr;" : "Continue &rarr;";
  // disabled state already set inside renderCarousel
}

function bindToggles(){
  bindPeek();
  stage.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{
    b.nextElementSibling.classList.toggle("open");
  }));
}

// ============ RESULTS ============
function showResults(){
  kulaEmbed("completed");
  setTimeout(function(){var b=document.getElementById("finish-btn");if(b&&!b.dataset.kembed){b.dataset.kembed="1";b.addEventListener("click",function(){kulaEmbed("advance");});}},0);
  topBar.classList.add("hidden");
  nav.classList.add("hidden");
  let correct=0;
  assessedIds.forEach(i=>{ if(isRight(i)) correct++; });
  const total=assessedIds.length;
  const pct = total?Math.round(correct/total*100):0;
  let band="", desc="";
  if(pct>=85){ band="Excellent"; desc=RESULTS.bands.excellent; }
  else if(pct>=70){ band="Strong"; desc=RESULTS.bands.strong; }
  else if(pct>=55){ band="Solid"; desc=RESULTS.bands.solid; }
  else if(pct>=40){ band="Patchy"; desc=RESULTS.bands.patchy; }
  else { band="Start again"; desc=RESULTS.bands.start; }
  const rows=spine().map(sp=>{
    const ids=assessedIds.filter(i=>FLOW[i].level===sp);
    if(!ids.length) return "";
    const g=ids.filter(i=>isRight(i)).length;
    const p=Math.round(g/ids.length*100);
    return `<div class="bd-row"><div class="bd-name">${sp}</div><div class="bd-bar"><div class="bd-fill" style="width:${p}%"></div></div><div class="bd-score">${g}/${ids.length}</div></div>`;
  }).join("");
  const parts=buildIds.filter(i=>state.revealed[i]).map(i=>FLOW[i].part);
  const runsum = parts.length?`<div class="breakdown"><div class="breakdown-label">Your running summary</div><ol style="margin:0;padding-left:1.3rem;">${parts.map(p=>`<li style="font-size:0.98rem;line-height:1.62;margin-bottom:0.6rem;">${esc(p)}</li>`).join("")}</ol></div>`:"";
  stage.innerHTML = `
    <div class="results-head">
      <div class="results-eyebrow">${RESULTS.eyebrow||"Lesson report"}</div>
      <h1 class="results-title">${esc(RESULTS.title||"Where you stand")}</h1>
    </div>
    <div class="score-row">
      <div class="score-block"><div class="score-num">${correct}<span class="score-den">/${total}</span></div><div class="score-label">Correct</div></div>
      <div class="score-block"><div class="score-num">${pct}<span class="score-den">%</span></div><div class="score-label">Accuracy</div></div>
      <div class="score-block"><div class="score-word">${band}</div><div class="score-label">Band</div></div>
    </div>
    <div class="grade-desc">${desc}</div>
    <div class="breakdown"><div class="breakdown-label">By skill</div>${rows}</div>
    ${runsum}
    <div class="results-actions">
      <button class="btn-secondary" id="restart-btn">Restart lesson</button>
      <button class="btn-primary" id="finish-btn">Finish &rarr;</button>
    </div>
    ${RESULTS.footer?`<div style="text-align:center;margin-top:1.1rem;font-size:0.92rem;color:var(--fade);">${esc(RESULTS.footer)}</div>`:""}`;
  document.getElementById("restart-btn").addEventListener("click",()=>{
    state.idx=-1; state.answers={}; state.revealed={}; state.order={}; state.carRead={}; state.interState={}; state.poppedBuild={};
    renderCover();
  });
  document.getElementById("finish-btn").addEventListener("click",()=>{
    const back=document.createElement("div");
    back.className="pop-back";
    const D = RESULTS.done||{};
    back.innerHTML=`<div class="pop"><div class="pop-label">${esc(D.label||"Lesson complete")}</div>${D.title?`<h3 style="margin:.4rem 0 .2rem;font-size:1.05rem;">${esc(D.title)}</h3>`:""}<div class="pop-text">${esc(D.text||"Tap Done to continue to the next lesson.")}</div><button class="pop-btn" id="fin-ok">Close</button></div>`;
    document.body.appendChild(back);
    document.getElementById("fin-ok").addEventListener("click",()=>back.remove());
  });
}

function isRight(i){
  const item=FLOW[i]; const ans=state.answers[i];
  if(ans===undefined) return false;
  if(item.mode==="order") return JSON.stringify(ans)===JSON.stringify(item.answer);
  if(item.mode==="sort"){ return item.items.every((_,ci)=>ans[ci]===item.answer[ci]); }
  return ans===item.correct;
}

renderCover();
})();


/* ---- MODE TOGGLE ---------------------------------------------------------
   Injects its own button so there is no stray markup, and lives inside the
   single script block so a first-to-last script extraction still parses. */
(function(){
  try{ var st = localStorage.getItem("kula-mode");
    if(st === "dark"){ document.body.classList.add("dark"); }
    else if(st !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){ document.body.classList.add("dark"); }
  }catch(e){}
  var SUN='<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
  var MOON='<path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/>';
  var b=document.getElementById("kula-mode-toggle");
  if(!b){
    b=document.createElement("button");
    b.className="mode-toggle"; b.id="kula-mode-toggle"; b.type="button";
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" id="mode-icon"></svg><span id="mode-label"></span>';
    document.body.appendChild(b);
  }
  var lab=document.getElementById("mode-label"), ic=document.getElementById("mode-icon");
  function paint(){
    var onDark=document.body.classList.contains("dark");
    var showing = onDark ? "dark" : "light";
    var offering = showing==="dark" ? "light" : "dark";
    lab.textContent = offering==="light" ? "Light mode" : "Dark mode";
    ic.innerHTML = offering==="light" ? SUN : MOON;
    b.setAttribute("aria-pressed", onDark ? "true" : "false");
    b.setAttribute("aria-label", "Switch to " + offering + " mode");
  }
  b.addEventListener("click",function(){
    var onDark=document.body.classList.toggle("dark");
    try{ localStorage.setItem("kula-mode", onDark ? "dark" : "light"); }catch(e){}
    paint();
  });
  paint();

})();
</script>
</body>
